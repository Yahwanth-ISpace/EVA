version: '3.9'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    working_dir: /app/apps/backend
    volumes:
      - .:/app
    depends_on:
      - mongo
      - ai-server

  ai-server:
    build:
      context: ./apps/ai-server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    working_dir: /app/apps/ai-server
    volumes:
      - ./apps/ai-server:/app/apps/ai-server

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
