version: '3.9'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - apps/backend/.env
    working_dir: /app/apps/backend
    volumes:
      - .:/app
    depends_on:
      - mongo
      - ai-server

  ai-server:
    build:
      context: ./apps/ai-server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - apps/backend/.env
    environment:
      AI_REQUIRE_AUTH: "true"
    working_dir: /app/apps/ai-server
    volumes:
      - ./apps/ai-server:/app/apps/ai-server

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
